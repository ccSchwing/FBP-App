AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: FBPService
Parameters:
  FBPUsersTableName:
    Type: String
    Default: FBP-Users
  FBPConfigTableName:
    Type: String
    Default: FBP-Config
  FBPScheduleTableName:
    Type: String
    Default: 2025-Schedule
  FBPPicksTableName:
    Type: String
    Default: FBP-Picks
  FBPLogsTableName:
    Type: String
    Default: 2025-Log
  # This is the original weekly results table.
  # After coding for a new table, this can be removed.
  FBPWeeklyResultsTableName:
    Type: String
    Default: FBP-Weekly-Results
  # This is the new weekly results table that will be used going forward.
  # It uses a Global Secondary Index on WeekIndex to make it easier to query by week.
  # It will replace the original FBPWeeklyResultsTableName after
  # we verify the new one is working correctly and update all code to use it.
  FBPWeeklyResults2025TableName:
    Type: String
    Default: FBP-Weekly-Results-2025
  FBPTeamRecordsTableName:
    Type: String
    Default: 2025-Record
  TwilioOptOutTableName:
    Type: String
    Default: FBP-SMS-Opt-Outs
  FBPPayoutLedgerTableName:
    Type: String
    Default: FBP-Payout-Ledger
  PdfLoggingBucketName:
    Type: String
    Default: fbp-pdf-logging
  FBPWeeklyResultsWeekIndexName:
    Type: String
    Default: WeekIndex
  # This is the GSI on the new weekly results table to make it easier to query by week.
  FBPWeeklyResults2025WeekIndexName:
    Type: String
    Default: WeekIndex
  S3BucketName:
    Type: String
    Default: my-fbp.com
  SESBucketName:
    Type: String
    Default: my-fbp-inbound-email
  ForwardToEmail:
    Type: String
    Description: External email address to forward emails to
    Default: chuckschwing@proton.me
  FromEmail:
    Type: String
    Description: Verified SES identity to send from
    Default: fbpadmin@my-fbp.com
  CompanyName:
    Type: String
    Default: FBP
  BaseUrl:
    Type: String
    Default: https://my-fbp.com
  SupportEmail:
    Type: String
    Description: Support email address for the company
    Default: fbpadmin@my-fbp.com
  # Parameters for SMS
  TwilioPhoneNumber:
    Type: String
    Description: Originating Twilio phone number in E.164 format (e.g., +1234567890)
    Default: '+16093012328'
    AllowedPattern: ^\+[1]\d{1,11}$ # E.164 format, US numbers only
  TwilioCredentialsSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing Twilio credentials
    # Replace with the actual ARN of your secret. The secret should contain the Twilio Account SID and Auth Token.
    Default: arn:aws:secretsmanager:us-east-1:768286545465:secret:TWILIO_SECRET-a6Y1ZP
  TwilioSecret:
    Type: String
    Description: JSON string containing Twilio credentials (Account SID and Auth
      Token and Twilio Phone number).
    Default: Twilio-Secret
  KnowledgeBaseId:
    Type: String
    Description: ID of the Bedrock Knowledge Base
    Default: FLBWAWSNBG
  DataSourceId:
    Type: String
    Description: ID of the Bedrock data source
    Default: LULFE6CQPM
Resources:
  FBPLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: fbplib
      Description: Shared FBP Python utility library
      ContentUri: src/FBPLib-Layer/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12
  TwilioLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: twilio-layer
      Description: Twilio Python SDK
      ContentUri: twilio-layer/twilio-layer.zip
      CompatibleRuntimes:
        - python3.12
  TwilioWebHook:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-twilio-webhook
      CodeUri: src/TwilioWebHook/src/
      Handler: TwilioWebHook.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
        - !Ref TwilioLayer
      Environment:
        Variables:
          TwilioOptOutTableName: !Ref TwilioOptOutTableName
          FBPLogsTableName: !Ref FBPLogsTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TwilioOptOutTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
      Events:
        TwilioWebHookPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /twilio-webhook
            Method: post
            PayloadFormatVersion: '2.0'
        TwilioWebHookOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /twilio-webhook
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  WeasyprintLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: weasyprint-layer
      Description: WeasyPrint HTML to PDF
      ContentUri: weasyprint-layer/weasyprint-layer.zip
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
  HTMLtoPDF:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-html-to-pdf
      CodeUri: src/HTMLtoPDF/src/
      Handler: HTMLtoPDF.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
        - !Ref WeasyprintLayer
      Environment:
        Variables:
          S3BucketName: !Ref S3BucketName
          PDFLoggingBucket: !Ref PdfLoggingBucketName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${S3BucketName}/*
                - !Sub arn:aws:s3:::${PdfLoggingBucketName}/*
      Events:
        HTMLtoPDFPostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /html-to-pdf
            Method: post
            PayloadFormatVersion: '2.0'
        HTMLtoPDFOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /html-to-pdf
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  ChatBot:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-chatbot
      CodeUri: src/ChatBot/src/
      Handler: ChatBot.chatbot
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          KnowledgeBaseId: !Ref KnowledgeBaseId
          DataSourceId: !Ref DataSourceId
          S3BucketName: !Ref S3BucketName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:RetrieveAndGenerate
                - bedrock:Retrieve
                - bedrock:AgenticRetrieveStream
              Resource: '*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: arn:aws:logs:*:*:*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${S3BucketName}/*
      Events:
        ChatBotPostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /chatbot
            Method: post
            PayloadFormatVersion: '2.0'
  ChatBotSync:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-chatbotsync
      CodeUri: src/ChatBotSync/src/
      Handler: ChatBotSync.export_dynamodb_to_kb
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          KnowledgeBaseId: !Ref KnowledgeBaseId
          DataSourceId: !Ref DataSourceId
          S3BucketName: !Ref S3BucketName
          FBPScheduleTableName: !Ref FBPScheduleTableName
          FBPUsersTableName: !Ref FBPUsersTableName
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPPicksTableName: !Ref FBPPicksTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPWeeklyResults2025TableName: !Ref FBPWeeklyResults2025TableName

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPScheduleTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPUsersTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPPicksTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPWeeklyResults2025TableName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource: '*'
            - Effect: Allow
              Action:
                - bedrock:RetrieveAndGenerate
                - bedrock:Retrieve
                - bedrock:AgenticRetrieveStream
                - bedrock:StartIngestionJob
                - bedrock:DescribeIngestionJob
                - bedrock:ListIngestionJobs
                - bedrock:GetIngestionJob
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:data-source/${DataSourceId}
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: arn:aws:logs:*:*:*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${S3BucketName}/*
      Events:
        ChatBotSyncPostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /chatbotsync
            Method: post
            PayloadFormatVersion: '2.0'
        ChatBotSyncOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /chatbotsync
            Method: OPTIONS
            PayloadFormatVersion: '2.0'

  GetCurrentWeek:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-current-week
      CodeUri: src/GetCurrentWeek/src/
      Handler: GetCurrentWeek.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
      Events:
        GetCurrentWeekPostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getCurrentWeek
            Method: post
            PayloadFormatVersion: '2.0'
        GetCurrentWeekOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getCurrentWeek
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  UpdateTeamRecords:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-update-team-records
      CodeUri: src/UpdateTeamRecords/src/
      Handler: UpdateTeamRecords.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPTeamRecordsTableName: !Ref FBPTeamRecordsTableName
          FBPScheduleTableName: !Ref FBPScheduleTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPScheduleTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPTeamRecordsTableName
      Events:
        TeamRecordGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /updateTeamRecords
            Method: get
            PayloadFormatVersion: '2.0'
        TeamRecordOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /updateTeamRecords
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  GetTeamRecords:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-team-records
      CodeUri: src/GetTeamRecords/src/
      Handler: GetTeamRecords.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPTeamRecordsTableName: !Ref FBPTeamRecordsTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPTeamRecordsTableName
      Events:
        GetTeamRecordsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getTeamRecords
            Method: get
            PayloadFormatVersion: '2.0'
        GetTeamRecordsOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getTeamRecords
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  FBPPayoutLedger:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-fbp-payout-ledger
      CodeUri: src/FBPPayoutLedger/src/
      Handler: FBPPayoutLedger.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPWeeklyResults2025TableName: !Ref FBPWeeklyResults2025TableName
          FBPUsersTableName: !Ref FBPUsersTableName
          FBPPayoutLedgerTableName: !Ref FBPPayoutLedgerTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPWeeklyResults2025TableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPUsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPPayoutLedgerTableName
      Events:
        FBPLedgerGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getFBPLedger
            Method: get
            PayloadFormatVersion: '2.0'
        FBPLedgerPostDepositApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /deposit
            Method: post
            PayloadFormatVersion: '2.0'
        FBPLedgerPostPayoutApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /payout
            Method: post
            PayloadFormatVersion: '2.0'
  ImportSpreadsAndFinalScores:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-import-spreads-and-final-scores
      CodeUri: src/ImportSpreadsAndFinalScores/src/
      Handler: ImportSpreadsAndFinalScores.importSpreadsAndFinalScores
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPSchedule2025TableName: !Ref FBPScheduleTableName
          S3BucketName: !Ref S3BucketName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPScheduleTableName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${S3BucketName}/*
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub arn:aws:s3:::${S3BucketName}/*
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub arn:aws:s3:::${S3BucketName}/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub arn:aws:s3:::${S3BucketName}
  OpenPool:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-open-pool
      CodeUri: src/OpenPool/src/
      Handler: OpenPool.openPool
      Runtime: python3.12
      Timeout: 240
      MemorySize: 512
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          SetPoolStatusOpen: !Ref SetPoolStatusOpen # Open pool for new week.
          CalcWeeklyResults: !Ref CalcWeeklyResults # Calc NFL Game Results for the week just ended.
          UpdateWeeklyResults: !Ref UpdateWeeklyResults # Update User results.
          ImportSpreadsAndFinalScores: !Ref ImportSpreadsAndFinalScores # Import spreads and final scores for the week.
          AdvancedMessagingService: !Ref AdvancedMessagingService # Send messages to users about new week and weekly results.
          SendEmail: !Ref SendEmail
          FBPWeeklyResults2025TableName: !Ref FBPWeeklyResults2025TableName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt CalcWeeklyResults.Arn
                - !GetAtt UpdateWeeklyResults.Arn
                - !GetAtt ImportSpreadsAndFinalScores.Arn
                - !GetAtt AdvancedMessagingService.Arn
                - !GetAtt SendEmail.Arn
                - !GetAtt SetPoolStatusOpen.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPWeeklyResults2025TableName

  ClosePool:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-close-pool
      CodeUri: src/ClosePool/src/
      Handler: ClosePool.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          SetPoolStatusClosed: !Ref SetPoolStatusClosed # Close pool for the week. This is the last thing done.
          SaveFBPPicks: !Ref SaveFBPPicks # Validate user picks
          SendEmail: !Ref SendEmail # Send email for PickSheet and GridSheet.
          ImportSpreadsAndFinalScores: !Ref ImportSpreadsAndFinalScores # Import spreads and final scores for the week.
          AdvancedMessagingService: !Ref AdvancedMessagingService # Send messages to users about new week and weekly results.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt SaveFBPPicks.Arn # Validate picks.
                - !GetAtt SendEmail.Arn # Send email with results to users.
                - !GetAtt SetPoolStatusClosed.Arn # Close pool for new week.
                - !GetAtt ImportSpreadsAndFinalScores.Arn # Import spreads and final scores for the week.
                - !GetAtt AdvancedMessagingService.Arn # Send messages to users about new week and weekly results.
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
      Events:
        ClosePoolGET:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /closePool
            Method: GET
            PayloadFormatVersion: '2.0'
        ClosePoolOPTIONS:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /closePool
            Method: OPTIONS
            PayloadFormatVersion: '2.0'

  EmailForwarding:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-email-forwarder
      CodeUri: src/EmailForwarding/src
      Handler: EmailForwarding.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FORWARD_TO_EMAIL: !Ref ForwardToEmail
          FROM_EMAIL: !Ref FromEmail
          SESBucketName: !Ref SESBucketName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${SESBucketName}/*
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
  # Permission for SES to invoke the Lambda function
  SESInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmailForwarding
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
  AdvancedMessagingServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${SESBucketName}/*
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
        - PolicyName: TwilioSMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref TwilioCredentialsSecretArn
        - PolicyName: DynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FBPUsersTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FBPLogsTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TwilioOptOutTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FBPConfigTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FBPWeeklyResults2025TableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FBPWeeklyResults2025TableName}/index/${FBPWeeklyResults2025WeekIndexName}

        - PolicyName: XRayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  AdvancedMessagingService:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-advanced-messaging-service
      CodeUri: src/AdvancedMessagingService/src/
      Handler: AdvancedMessagingService.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt AdvancedMessagingServiceRole.Arn
      Tracing: Active
      Layers:
        - !Ref FBPLibLayer
        - !Ref TwilioLayer
      Events:
        AdvancedMessagingServicePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-messaging
            Method: POST
            PayloadFormatVersion: '2.0'
        AdvancedMessagingServiceOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-messaging
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
      Environment:
        Variables:
          FROM_EMAIL: !Ref FromEmail
          COMPANY_NAME: !Ref CompanyName
          BASE_URL: !Ref BaseUrl
          SUPPORT_EMAIL: !Ref SupportEmail
          FBPUSERS_TABLE_NAME: !Ref FBPUsersTableName
          FBPLOGS_TABLE_NAME: !Ref FBPLogsTableName
          TWILIO_OPT_OUT_TABLE_NAME: !Ref TwilioOptOutTableName
          TWILIO_CREDENTIALS_SECRET_ARN: !Ref TwilioCredentialsSecretArn
          POWERTOOLS_SERVICE_NAME: messaging-service
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_METRICS_NAMESPACE: MessagingService
          POWERTOOLS_TRACER_CAPTURE_RESPONSE: true
          POWERTOOLS_TRACER_CAPTURE_ERROR: true

  AdvancedSMSServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
