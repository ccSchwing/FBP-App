AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: FBPService
Parameters:
  FBPUsersTableName:
    Type: String
    Default: FBP-Users
  FBPConfigTableName:
    Type: String
    Default: FBP-Config
  FBPScheduleTableName:
    Type: String
    Default: 2025-Schedule
  FBPPicksTableName:
    Type: String
    Default: FBP-Picks
  FBPLogsTableName:
    Type: String
    Default: 2025-Log
  # This is the original weekly results table.
  # After coding for a new table, this can be removed.
  FBPWeeklyResultsTableName:
    Type: String
    Default: FBP-Weekly-Results
  # This is the new weekly results table that will be used going forward.
  # It uses a Global Secondary Index on WeekIndex to make it easier to query by week.
  # It will replace the original FBPWeeklyResultsTableName after
  # we verify the new one is working correctly and update all code to use it.
  FBPWeeklyResults2025TableName:
    Type: String
    Default: FBP-Weekly-Results-2025
  FBPPayoutLedgerTableName:
    Type: String
    Default: FBP-Payout-Ledger
  FBPWeeklyResultsWeekIndexName:
    Type: String
    Default: WeekIndex
  # This is the GSI on the new weekly results table to make it easier to query by week.
  FBPWeeklyResults2025WeekIndexName:
    Type: String
    Default: WeekIndex
  S3BucketName:
    Type: String
    Default: my-fbp.com
  SESBucketName:
    Type: String
    Default: my-fbp-inbound-email
  ForwardToEmail:
    Type: String
    Description: External email address to forward emails to
    Default: chuckschwing@proton.me
  FromEmail:
    Type: String
    Description: Verified SES identity to send from
    Default: fbpadmin@my-fbp.com
  # Parameters for SMS
  NotifyConfigId:
      Type: String
      Description: AWS End User Messaging Notify Configuration ID
      Default: nc-1234567890abcdef0
  DefaultPhoneNumber:
    Type: String
    Description: Default phone number for alerts
    Default: '+17325007427'
    AllowedPattern: '^\+[1]\d{1,11}$'   # E.164 format, US numbers only
Resources:
  FBPLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: fbplib
      Description: Shared FBP Python utility library
      ContentUri: src/FBPLib-Layer/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12
  FBPPayoutLedger:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fbp-payout-ledger"
      CodeUri: src/FBPPayoutLedger/src/
      Handler: FBPPayoutLedger.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPWeeklyResults2025TableName: !Ref FBPWeeklyResults2025TableName
          FBPUsersTableName: !Ref FBPUsersTableName
          FBPPayoutLedgerTableName: !Ref FBPPayoutLedgerTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPWeeklyResults2025TableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPUsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPPayoutLedgerTableName
  ImportSpreadsAndFinalScores:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-import-spreads-and-final-scores"
      CodeUri: src/ImportSpreadsAndFinalScores/src/
      Handler: ImportSpreadsAndFinalScores.importSpreadsAndFinalScores
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPSchedule2025TableName: !Ref FBPScheduleTableName
          S3BucketName: !Ref S3BucketName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPScheduleTableName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${S3BucketName}"
  OpenPool:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-open-pool"
      CodeUri: src/OpenPool/src/
      Handler: OpenPool.openPool
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          SetPoolStatusOpen: !Ref SetPoolStatusOpen     # Open pool for new week.
          CalcWeeklyResults: !Ref CalcWeeklyResults     # Calc NFL Game Results for the week just ended.
          UpdateWeeklyResults: !Ref UpdateWeeklyResults
          SendEmail: !Ref SendEmail
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt CalcWeeklyResults.Arn
               # - !GetAtt SaveFBPPicks.Arn
                - !GetAtt UpdateWeeklyResults.Arn
                - !GetAtt SendEmail.Arn
                - !GetAtt SetPoolStatusOpen.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName

  ClosePool:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-close-pool"
      CodeUri: src/ClosePool/src/
      Handler: ClosePool.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          SetPoolStatusClosed: !Ref SetPoolStatusClosed     # Close pool for the week. This is the last thing done.
          SaveFBPPicks: !Ref SaveFBPPicks                   # Validate user picks
          SendEmail: !Ref SendEmail                         # Send email for PickSheet and GridSheet.
          ImportSpreadsAndFinalScores: !Ref ImportSpreadsAndFinalScores
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt SaveFBPPicks.Arn          # Validate picks.
                - !GetAtt SendEmail.Arn             # Send email with results to users.
                - !GetAtt SetPoolStatusClosed.Arn   # Close pool for new week.
                - !GetAtt ImportSpreadsAndFinalScores.Arn # Import spreads and final scores for the week.
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
      Events:
        ClosePoolGET:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /closePool
            Method: GET
            PayloadFormatVersion: '2.0'
        ClosePoolOPTIONS:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /closePool
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  

  EmailForwarding:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-email-forwarder"
      CodeUri: src/EmailForwarding/src
      Handler: EmailForwarding.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Layers: 
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FORWARD_TO_EMAIL: !Ref ForwardToEmail
          FROM_EMAIL: !Ref FromEmail
          SESBucketName: !Ref SESBucketName 
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${SESBucketName}/*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
  # Permission for SES to invoke the Lambda function
  SESInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmailForwarding
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
  SendSMS:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SendSMS/src/
      Handler: SendSMS.lambda_handler
      Runtime: python3.12
      Environment:
        Variables:
          NOTIFY_CONFIG_ID: nc-your-actual-config-id
          DEFAULT_PHONE_NUMBER: +1234567890
          MY_REGION: us-east-1
      Layers:
        - !Ref FBPLibLayer
      Policies:
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                - sms-voice:SendNotifyTextMessage
                - sms-voice:DescribeNotifyTemplates
                - sms-voice:DescribeNotifyConfiguration
                Resource: '*'
  SendEmailRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - ses:SendTemplatedEmail
                  - ses:SendBulkTemplatedEmail
                Resource: "*"
        - PolicyName: DynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: 
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FBP-Config"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/2025-Log"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FBP-Users"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FBP-Weekly-Results-2025"
  GetUserStatus:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/GetUserStatus/src/
      Handler: GetUserStatus.lambda_handler
      Runtime: python3.12
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName  
        - DynamoDBReadPolicy:
            TableName: !Ref FBPUsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPUsersTableName: !Ref FBPUsersTableName
          FBPLogsTableName: !Ref FBPLogsTableName
      Layers:
        - !Ref FBPLibLayer
      Events:
        GetUserStatusPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getUserStatus
            Method: POST
            PayloadFormatVersion: '2.0'
        GetUserStatusOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getUserStatus
            Method: OPTIONS
            PayloadFormatVersion: '2.0'

  QueryFBPLogs:
    Type: AWS::Serverless::Function
