# - Keep only values actively consumed by frontend config, scripts, or other stacks.
# - Prefer endpoint URLs, IDs, and function names; avoid ARN outputs unless required.
# - If an output has Export.Name, verify no stack imports it before renaming/removing.
# - Keep this section under 60 entries to stay within CloudFormation limits.
Outputs:
  HttpAPiUrl:
    Description: URL of the HTTP API gateway
    Value: !Sub https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
    Export:
      Name: !Sub ${AWS::StackName}-HttpApiUrl
  HttpApiId:
    Description: HTTP API ID
    Value: !Ref MyHttpApi
    Export:
      Name: !Sub ${AWS::StackName}-HttpApiId
  AdvancedMessagingServiceFunctionName:
    Description: Name of the AdvancedMessagingService Lambda function
    Value: !Ref AdvancedMessagingService
    Export:
      Name: !Sub "${AWS::StackName}-AdvancedMessagingService"
  AdvancedMessagingServiceEndpoint:
    Description: Endpoint for the AdvancedMessagingService API
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/advanced-messaging"
    Export:
      Name: !Sub "${AWS::StackName}-AdvancedMessagingEndpoint"
  AdvancedSMSServiceFunctionName:
    Description: Name of the AdvancedSMSService Lambda function (retained until AdvancedMessagingService is verified)
    Value: !Ref AdvancedSMSService
    Export:
      Name: !Sub "${AWS::StackName}-AdvancedSMSService"
  AdvancedSMSServiceEndpoint:
    Description: Endpoint for the AdvancedSMSService API (retained until AdvancedMessagingService is verified)
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/advancedSMSService"
    Export:
      Name: !Sub "${AWS::StackName}-AdvancedSMSEndpoint"
  # TwilioWebhookFunctionName:
  #   Description: Name of the TwilioWebhook Lambda function
  #   Value: !Ref TwilioWebHook
  #   Export:
  #     Name: !Sub "${AWS::StackName}-twilio-webhook"
  TwilioWebhookEndpoint:
    Description: Endpoint for the TwilioWebhook API
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/twilio-webhook"
    Export:
      Name: !Sub "${AWS::StackName}-twilio-webhook-endpoint"
  SMSVerificationFunctionName:
    Description: Name of the SMSValidationUtils Lambda function
    Value: !Ref SMSValidationUtils
    Export:
      Name: !Sub "${AWS::StackName}-SMSVerificationCodeFunctionName"
  SMSStoreVerificationCodeEndpoint:
    Description: Endpoint for sending SMS verification codes
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/storeSMSVerificationCode"
    Export:
      Name: !Sub "${AWS::StackName}-SMSStoreVerificationCodeEndpoint"
  SMSGetVerificationCodeEndpoint:
    Description: Endpoint for sending SMS verification codes
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/getSMSVerificationCode"
    Export:
      Name: !Sub "${AWS::StackName}-SMSGetVerificationCodeEndpoint"
  SMSUpdateVerificationCodeEndpoint:
    Description: Endpoint for updating SMS verification status
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/updateSMSVerification"
    Export:
      Name: !Sub "${AWS::StackName}-SMSUpdateVerificationCodeEndpoint"
  GetTeamRecordsEndpoint:
    Description: Endpoint for the GetTeamRecords API
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/getTeamRecords"
    Export:
      Name: !Sub "${AWS::StackName}-GetTeamRecordsEndpoint"
  FBPPayoutLedgerFunctionName:
    Description: Name of the FBP Payout Ledger Lambda function
    Value: !Ref FBPPayoutLedger
    Export:
      Name: !Sub "${AWS::StackName}-FBPPayoutLedgerFunctionName"
  # API endpoints (add these)
  FBPLedgerApiBaseUrl:
    Description: Base URL of the FBP Ledger API
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-FBPLedgerApiBaseUrl"
      
  # Optional: Specific endpoint URLs for convenience
  FBPLedgerGetEndpoint:
    Description: GET endpoint for FBP Ledger
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/getFBPLedger"
    
  FBPLedgerDepositEndpoint:
    Description: POST endpoint for deposits
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/deposit"
    
  FBPLedgerPayoutEndpoint:
    Description: POST endpoint for payouts
    Value: !Sub "https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/payout"
  GetUserStatusFunctionName:
    Description: Name of the GetUserStatus Lambda function
    Value: !Ref GetUserStatus
    Export:
      Name: !Sub "${AWS::StackName}-GetUserStatusFunctionName"
  GetUserStatusApi:
    Description: URL of the GetUserStatus API endpoint
    Value: !Sub https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/getUserStatus
    Export:
      Name: !Sub ${AWS::StackName}-GetUserStatusApi
  GetScheduleFunctionName:
    Description: Name of the GetSchedule Lambda function
    Value: !Ref GetSchedule
    Export:
      Name: !Sub "${AWS::StackName}-GetScheduleFunctionName"
  GetScheduleApi:
    Description: URL of the GetSchedule API endpoint
    Value: !Sub https://${MyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/getschedule
    Export:
      Name: !Sub ${AWS::StackName}-GetScheduleApi
  QueryFBPLogsFunctionName:
