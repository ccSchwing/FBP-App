AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: FBPService
Parameters:
  FBPUsersTableName:
    Type: String
    Default: FBP-Users
  FBPConfigTableName:
    Type: String
    Default: FBP-Config
  FBPScheduleTableName:
    Type: String
    Default: 2025-Schedule
  FBPPicksTableName:
    Type: String
    Default: FBP-Picks
  FBPLogsTableName:
    Type: String
    Default: 2025-Log
  # This is the original weekly results table.
  # After coding for a new table, this can be removed.
  FBPWeeklyResultsTableName:
    Type: String
    Default: FBP-Weekly-Results
  # This is the new weekly results table that will be used going forward.
  # It uses a Global Secondary Index on WeekIndex to make it easier to query by week.
  # It will replace the original FBPWeeklyResultsTableName after
  # we verify the new one is working correctly and update all code to use it.
  FBPWeeklyResults2025TableName:
    Type: String
    Default: FBP-Weekly-Results-2025
  FBPTeamRecordsTableName:
    Type: String
    Default: 2025-Record
  TwilioOptOutTableName:
    Type: String
    Default: FBP-SMS-Opt-Outs
  FBPPayoutLedgerTableName:
    Type: String
    Default: FBP-Payout-Ledger
  FBPWeeklyResultsWeekIndexName:
    Type: String
    Default: WeekIndex
  # This is the GSI on the new weekly results table to make it easier to query by week.
  FBPWeeklyResults2025WeekIndexName:
    Type: String
    Default: WeekIndex
  S3BucketName:
    Type: String
    Default: my-fbp.com
  SESBucketName:
    Type: String
    Default: my-fbp-inbound-email
  ForwardToEmail:
    Type: String
    Description: External email address to forward emails to
    Default: chuckschwing@proton.me
  FromEmail:
    Type: String
    Description: Verified SES identity to send from
    Default: fbpadmin@my-fbp.com
  CompanyName:
    Type: String
    Default: FBP
  BaseUrl:
    Type: String
    Default: https://my-fbp.com
  SupportEmail:
    Type: String
    Description: Support email address for the company
    Default: fbpadmin@my-fbp.com
  # Parameters for SMS
  TwilioPhoneNumber:
    Type: String
    Description: Originating Twilio phone number in E.164 format (e.g., +1234567890)
    Default: '+16093012328'
    AllowedPattern: '^\+[1]\d{1,11}$'   # E.164 format, US numbers only
  TwilioCredentialsSecretArn:
      Type: String
      Description: ARN of the Secrets Manager secret containing Twilio credentials
      # Replace with the actual ARN of your secret. The secret should contain the Twilio Account SID and Auth Token.
      Default: arn:aws:secretsmanager:us-east-1:768286545465:secret:TWILIO_SECRET-a6Y1ZP
  TwilioSecret:
    Type: String
    Description: JSON string containing Twilio credentials (Account SID and Auth Token and Twilio Phone number).
    Default: 'Twilio-Secret'
Resources:
  FBPLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: fbplib
      Description: Shared FBP Python utility library
      ContentUri: src/FBPLib-Layer/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12
  TwilioLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: twilio-layer
      Description: Twilio Python SDK
      ContentUri: twilio-layer/twilio-layer.zip
      CompatibleRuntimes:
        - python3.12
  TwilioWebHook:
     Type: AWS::Serverless::Function
     Properties:
      FunctionName: !Sub "${AWS::StackName}-twilio-webhook"
      CodeUri: src/TwilioWebHook/src/
      Handler: TwilioWebHook.lambda_handler
      Runtime: python3.12
      Layers:
         - !Ref FBPLibLayer
         - !Ref TwilioLayer
      Environment:
         Variables:
           TwilioOptOutTableName: !Ref TwilioOptOutTableName
           FBPLogsTableName: !Ref FBPLogsTableName
      Policies:
         - DynamoDBCrudPolicy:
             TableName: !Ref TwilioOptOutTableName
         - DynamoDBCrudPolicy:
             TableName: !Ref FBPLogsTableName
      Events:
        TwilioWebHookPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /twilio-webhook
            Method: post
            PayloadFormatVersion: '2.0'
        TwilioWebHookOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /twilio-webhook
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  TeamRecord:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-team-record"
      CodeUri: src/TeamRecord/src/
      Handler: TeamRecord.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPTeamRecordsTableName: !Ref FBPTeamRecordsTableName
          FBPScheduleTableName: !Ref FBPScheduleTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPScheduleTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPTeamRecordsTableName
      Events:
        TeamRecordGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getTeamRecord
            Method: get
            PayloadFormatVersion: '2.0'
        TeamRecordOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getTeamRecord
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  GetTeamRecords:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-team-records"
      CodeUri: src/GetTeamRecords/src/
      Handler: GetTeamRecords.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPTeamRecordsTableName: !Ref FBPTeamRecordsTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPTeamRecordsTableName
      Events:
        GetTeamRecordsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getTeamRecords
            Method: get
            PayloadFormatVersion: '2.0'
        GetTeamRecordsOptionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getTeamRecords
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  FBPPayoutLedger:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fbp-payout-ledger"
      CodeUri: src/FBPPayoutLedger/src/
      Handler: FBPPayoutLedger.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPWeeklyResults2025TableName: !Ref FBPWeeklyResults2025TableName
          FBPUsersTableName: !Ref FBPUsersTableName
          FBPPayoutLedgerTableName: !Ref FBPPayoutLedgerTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPWeeklyResults2025TableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPUsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPPayoutLedgerTableName
      Events:
        FBPLedgerGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getFBPLedger
            Method: get
            PayloadFormatVersion: '2.0'
        FBPLedgerPostDepositApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /deposit
            Method: post
            PayloadFormatVersion: '2.0'
        FBPLedgerPostPayoutApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /payout
            Method: post
            PayloadFormatVersion: '2.0'
  ImportSpreadsAndFinalScores:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-import-spreads-and-final-scores"
      CodeUri: src/ImportSpreadsAndFinalScores/src/
      Handler: ImportSpreadsAndFinalScores.importSpreadsAndFinalScores
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPSchedule2025TableName: !Ref FBPScheduleTableName
          S3BucketName: !Ref S3BucketName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPScheduleTableName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${S3BucketName}"
  OpenPool:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-open-pool"
      CodeUri: src/OpenPool/src/
      Handler: OpenPool.openPool
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          SetPoolStatusOpen: !Ref SetPoolStatusOpen     # Open pool for new week.
          CalcWeeklyResults: !Ref CalcWeeklyResults     # Calc NFL Game Results for the week just ended.
          UpdateWeeklyResults: !Ref UpdateWeeklyResults # Update User results.
          ImportSpreadsAndFinalScores: !Ref ImportSpreadsAndFinalScores # Import spreads and final scores for the week.
          SendEmail: !Ref SendEmail
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt CalcWeeklyResults.Arn
                - !GetAtt UpdateWeeklyResults.Arn
                - !GetAtt ImportSpreadsAndFinalScores.Arn
                - !GetAtt SendEmail.Arn
                - !GetAtt SetPoolStatusOpen.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName

  ClosePool:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-close-pool"
      CodeUri: src/ClosePool/src/
      Handler: ClosePool.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FBPConfigTableName: !Ref FBPConfigTableName
          FBPLogsTableName: !Ref FBPLogsTableName
          SetPoolStatusClosed: !Ref SetPoolStatusClosed     # Close pool for the week. This is the last thing done.
          SaveFBPPicks: !Ref SaveFBPPicks                   # Validate user picks
          SendEmail: !Ref SendEmail                         # Send email for PickSheet and GridSheet.
          ImportSpreadsAndFinalScores: !Ref ImportSpreadsAndFinalScores # Import spreads and final scores for the week.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt SaveFBPPicks.Arn          # Validate picks.
                - !GetAtt SendEmail.Arn             # Send email with results to users.
                - !GetAtt SetPoolStatusClosed.Arn   # Close pool for new week.
                - !GetAtt ImportSpreadsAndFinalScores.Arn # Import spreads and final scores for the week.
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
      Events:
        ClosePoolGET:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /closePool
            Method: GET
            PayloadFormatVersion: '2.0'
        ClosePoolOPTIONS:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /closePool
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  

  EmailForwarding:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-email-forwarder"
      CodeUri: src/EmailForwarding/src
      Handler: EmailForwarding.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Layers: 
        - !Ref FBPLibLayer
      Environment:
        Variables:
          FORWARD_TO_EMAIL: !Ref ForwardToEmail
          FROM_EMAIL: !Ref FromEmail
          SESBucketName: !Ref SESBucketName 
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${SESBucketName}/*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
  # Permission for SES to invoke the Lambda function
  SESInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmailForwarding
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
  AdvancedMessagingServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: TwilioSMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref TwilioCredentialsSecretArn
        - PolicyName: DynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FBPUsersTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TwilioOptOutTableName}"
        - PolicyName: XRayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  AdvancedMessagingService:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-advanced-messaging-service"
      CodeUri: src/AdvancedMessagingService/src/
      Handler: AdvancedMessagingService.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt AdvancedMessagingServiceRole.Arn
      Tracing: Active
      Layers:
        - !Ref FBPLibLayer
        - !Ref TwilioLayer
      Events:
        AdvancedMessagingServicePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-messaging
            Method: POST
            PayloadFormatVersion: '2.0'
        AdvancedMessagingServiceOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-messaging
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
      Environment:
        Variables:
          FROM_EMAIL: !Ref FromEmail
          COMPANY_NAME: !Ref CompanyName
          BASE_URL: !Ref BaseUrl
          SUPPORT_EMAIL: !Ref SupportEmail
          FBPUSERS_TABLE_NAME: !Ref FBPUsersTableName
          FBPLOGS_TABLE_NAME: !Ref FBPLogsTableName
          TWILIO_OPT_OUT_TABLE_NAME: !Ref TwilioOptOutTableName
          TWILIO_CREDENTIALS_SECRET_ARN: !Ref TwilioCredentialsSecretArn
          POWERTOOLS_SERVICE_NAME: messaging-service
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_METRICS_NAMESPACE: MessagingService
          POWERTOOLS_TRACER_CAPTURE_RESPONSE: true
          POWERTOOLS_TRACER_CAPTURE_ERROR: true

  AdvancedSMSServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TwilioSMSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref TwilioCredentialsSecretArn ## Replace with actual ARN of the secret containing Twilio credentials
        - PolicyName: XRayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
  AdvancedSMSService:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-advanced-sms-service"
      CodeUri: src/AdvancedSMSService/src/  # Adjust path as needed
      Handler: AdvancedSMSService.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt AdvancedSMSServiceRole.Arn
      Tracing: Active
      Layers:
        - !Ref FBPLibLayer
        - !Ref TwilioLayer
      Events:
        AdvancedSMSServicePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-sms
            Method: POST
            PayloadFormatVersion: '2.0'
        GetUserStatusOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-sms
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
      Environment:
        Variables:
          # Add any environment variables your new service needs
          TWILIO_SECRET: !Ref TwilioSecret
          TWILIO_PHONE_NUMBER: !Ref TwilioPhoneNumber
          COMPANY_NAME: !Ref CompanyName
          BASE_URL: !Ref BaseUrl
          SUPPORT_EMAIL: !Ref SupportEmail
          FBPUSERS_TABLE_NAME: !Ref FBPUsersTableName
          FBPLOGS_TABLE_NAME: !Ref FBPLogsTableName
          TWILIO_OPT_OUT_TABLE_NAME: !Ref TwilioOptOutTableName
          TWILIO_CREDENTIALS_SECRET_ARN: !Ref TwilioCredentialsSecretArn
          # Powertools configuration
          POWERTOOLS_SERVICE_NAME: email-service
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_METRICS_NAMESPACE: EmailService
          POWERTOOLS_TRACER_CAPTURE_RESPONSE: true
          POWERTOOLS_TRACER_CAPTURE_ERROR: true
  AdvancedEmailServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: XRayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  AdvancedEmailService:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-advanced-email-service"
      CodeUri: src/AdvancedEmailService/src/  # Adjust path as needed
      Handler: AdvancedEmailService.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt AdvancedEmailServiceRole.Arn
      Tracing: Active
      Layers:
        - !Ref FBPLibLayer
      Events:
        AdvancedEmailServicePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-email
            Method: POST
            PayloadFormatVersion: '2.0'
        GetUserStatusOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /advanced-email
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
      Environment:
        Variables:
          # Add any environment variables your new service needs
          FROM_EMAIL: !Ref FromEmail
          COMPANY_NAME: !Ref CompanyName
          BASE_URL: !Ref BaseUrl
          SUPPORT_EMAIL: !Ref SupportEmail
          FBPUSERS_TABLE_NAME: !Ref FBPUsersTableName
          FBPLOGS_TABLE_NAME: !Ref FBPLogsTableName
          
          # Powertools configuration
          POWERTOOLS_SERVICE_NAME: email-service
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_METRICS_NAMESPACE: EmailService
          POWERTOOLS_TRACER_CAPTURE_RESPONSE: true
          POWERTOOLS_TRACER_CAPTURE_ERROR: true


  SendEmailRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - ses:SendTemplatedEmail
                  - ses:SendBulkTemplatedEmail
                Resource: "*"
        - PolicyName: DynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: 
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FBP-Config"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/2025-Log"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FBP-Users"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FBP-Weekly-Results-2025"
  

  
  SMSValidationUtils:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SMSValidationUtils/src/
      Handler: SMSValidationUtils.lambda_handler
      FunctionName: !Sub "${AWS::StackName}-sms-validation-utils-code"
      Runtime: python3.12
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPUsersTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
      Environment:
        Variables:
          FBPUsersTableName: !Ref FBPUsersTableName
          FBPLogsTableName: !Ref FBPLogsTableName
      Layers:
        - !Ref FBPLibLayer
      Events:
        StoreSMSVerificationCodePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /storeSMSVerificationCode
            Method: POST
            PayloadFormatVersion: '2.0'
        StoreSMSVerificationCodeOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /storeSMSVerificationCode
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
        GetSMSVerificationCodePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getSMSVerificationCode
            Method: POST
            PayloadFormatVersion: '2.0'
        GetSMSVerificationCodeOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getSMSVerificationCode
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
        UpdateSMSVerificationPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /updateSMSVerification
            Method: POST
            PayloadFormatVersion: '2.0'
        UpdateSMSVerificationOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /updateSMSVerification
            Method: OPTIONS
            PayloadFormatVersion: '2.0'


  GetUserStatus:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/GetUserStatus/src/
      Handler: GetUserStatus.lambda_handler
      Runtime: python3.12
