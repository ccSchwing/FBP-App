      Events:
        GetScheduleGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getschedule
            Method: GET
            PayloadFormatVersion: '2.0'
        GetScheduleOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /getschedule
            Method: OPTIONS
            PayloadFormatVersion: '2.0'
  ResetDBs:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ResetDBs/src/
      Handler: ResetDBs.lambda_handler
      Runtime: python3.12
      Layers:
        - !Ref FBPLibLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPPicksTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPWeeklyResults2025TableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FBPConfigTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPUsersTableName
      Environment:
        Variables:
          FBPPicksTableName: !Ref FBPPicksTableName
          FBPWeeklyResults2025TableName: !Ref FBPWeeklyResults2025TableName
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPUsersTableName: !Ref FBPUsersTableName

      Events:
        ResetDBsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /resetDBs
            Method: GET
            PayloadFormatVersion: '2.0'
        ResetDBsOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /resetDBs
            Method: OPTIONS
            PayloadFormatVersion: '2.0'

  SendEmail:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SendEmail/src/
      Handler: SendEmail.lambda_handler
      Runtime: python3.12
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPLogsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FBPWeeklyResults2025TableName
      Environment:
        Variables:
          FBPLogsTableName: !Ref FBPLogsTableName
          FBPWeeklyResults2025TableName: !Ref FBPWeeklyResults2025TableName
      # SES stuff
      Role: 
        Fn::GetAtt:
          - SendEmailRole
          - Arn

      Layers:
        - !Ref FBPLibLayer
      Events:
        SendEmailPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MyHttpApi
            Path: /sendEmail
            Method: POST
            PayloadFormatVersion: '2.0'
        SendEmailOptions:
