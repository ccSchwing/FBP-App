  <style>
    .tooltip-wrap {
      position: relative;
      display: inline-block;
      vertical-align: middle;
    }

    .tooltip-wrap .tooltip {
      visibility: hidden;
      background: #333;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      position: absolute;
      bottom: 110%;
      left: 0;
      white-space: nowrap;
      z-index: 10;
    }


    .tooltip-wrap:hover .tooltip {
      visibility: visible;
    }

    /* Override page-title positioning to not cover menu button */
    .page-title {
      position: static;
      transform: none;
      left: auto;
    }

    .phone-verification-card {
      border: 1px solid #d7dce5;
      border-radius: 12px;
      padding: 1rem;
      background: linear-gradient(180deg, #fafbfd 0%, #f3f6fb 100%);
      width: min(100%, 34rem);
      margin-bottom: 1.25rem;
    }

    .phone-verification-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }

    .phone-verification-title {
      font-weight: 600;
    }

    .phone-verification-state {
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .phone-verification-state[data-state="not-set"] {
      background: #eef2f7;
      color: #435066;
    }

    .phone-verification-state[data-state="pending"] {
      background: #fff1cc;
      color: #8a5a00;
    }

    .phone-verification-state[data-state="verified"] {
      background: #dff5e8;
      color: #1c6b40;
    }

    .phone-verification-message {
      margin: 0 0 0.85rem;
      color: #4b5567;
      font-size: 0.92rem;
    }

    .phone-verification-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }

    .phone-verification-row:last-child {
      margin-bottom: 0;
    }

    .phone-verification-card #MobileNumber {
      width: 12.5rem;
      min-width: 12.5rem;
      box-sizing: border-box;
    }

    .phone-verification-card #MobileNumberVerification {
      width: 6.5rem;
      min-width: 6.5rem;
      box-sizing: border-box;
    }

    .phone-verification-card #verifySMSMobileNumberBtn {
      width: 11ch;
      min-width: 11ch;
    }

  <link rel="stylesheet" type="text/css" href="/css/styles.css" />
  <title>User Profile</title>
  <script type="module">
    (async () => {
      const { auth } = await import("/js/auth.js");
      await auth.ensureAuthenticated();
      const user = await auth.getUser();
      console.log("Authenticated user:", user);

  <title>View/Mod My Profile</title>
  <script type="module">
    import { getServiceUrl } from "/js-lib/urlConfig.js";

    let email = null;
    let originalMobileNumberDigits = "";

    function normalizePhoneDigits(value) {
      return (value || "").toString().replace(/\D/g, "").slice(0, 10);
    }

    async function resolveUserEmail() {
      if (email) return email;
      const { auth } = await import("/js/auth.js");
      const user = await auth.getUser();
      email = user?.profile?.email ?? null;
      console.log("User email:", email);
      return email;
    }
    window.resolveUserEmail = resolveUserEmail;

    let cachedProfileData = null;

    async function getUserProfile() {
      try {
        let response = null;
        const resolvedEmail = await resolveUserEmail();
        if (!resolvedEmail) {
          alert("No authenticated user email found. Please contact fbpadmin@my-fbp.com.");
          return null;
        }
        const URL_KEY = "getFBPUserPython";
        const lambdaURL = await getServiceUrl(URL_KEY);
        response = await fetch(lambdaURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: resolvedEmail,
          }),
        });
        const data = await response.text();
        console.log("Response:", data);
        window.userProfileData = JSON.parse(data);
        // I know I shouldn't do this, but:
        loadFormData(window.userProfileData);
        window.dispatchEvent(
          new CustomEvent("userProfileDataLoaded", {
            detail: window.userProfileData,
          }),
        );
        return window.userProfileData;
      } catch (error) {
        alert("Failed to load user profile. Contact fbpadmin@my-fbp.com" + (error.message || error));
        return null;
      }
    }
    async function loadFormData(userProfileData) {
      if (!userProfileData) {
        console.warn("No user profile data available to pre-fill form.");
        return;
      }
      window.userProfileData = userProfileData || {};
      console.log(
        "loadFormdata called with userProfileData:",
        window.userProfileData,
      );
      let responseBody = JSON.parse(window.userProfileData.body);
      console.log("Response body:", responseBody);
      document.getElementById("firstName").value =
        responseBody.firstName || "";
      document.getElementById("lastName").value = responseBody.lastName || "";
      document.getElementById("displayName").value =
        responseBody.displayName || "";
      const paymentMethod = responseBody.paymentMethod || "";
      const paymentRadioButtons = document.querySelectorAll(
        'input[name="paymentMethod"]',
      );
      paymentRadioButtons.forEach((radio) => {
        radio.checked = radio.value === paymentMethod;
      });
      document.getElementById("smsReminder").checked =
        responseBody.smsReminder || false;
      document.getElementById("smsPickSheet").checked =
        responseBody.smsPickSheet || false;
      document.getElementById("smsGridSheet").checked =
        responseBody.smsGridSheet || false;
      document.getElementById("emailPickSheet").checked =
        responseBody.emailPickSheet || false;
      document.getElementById("emailReminders").checked =
        responseBody.emailReminders || false;
      document.getElementById("emailGridSheet").checked =
        responseBody.emailGridSheet || false;
      const defaultAlgorithm = responseBody.defaultAlgorithm || "";
      const radioButtons = document.querySelectorAll(
        'input[name="defaultAlgorithm"]',
      );
      radioButtons.forEach((radio) => {
        radio.checked = radio.value === defaultAlgorithm;
      });
      document.getElementById("defaultTieBreaker").value =
        responseBody.defaultTieBreaker || "";
      const savedMobileNumber = responseBody.mobile_number || "";
      originalMobileNumberDigits = normalizePhoneDigits(savedMobileNumber);
      document.getElementById("MobileNumber").value = formatPhoneNumber(savedMobileNumber);
    }

    async function validateFormData() {
      const tieBreakerInput = document.getElementById("defaultTieBreaker");
      const tieBreakerValue = tieBreakerInput.value.trim();
      let errorMessages = [];
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const displayName = document.getElementById("displayName").value.trim();
      if (firstName === "") {
        errorMessages.push("First Name cannot be empty.");
      }
      if (lastName === "") {
        errorMessages.push("Last Name cannot be empty.");
      }
      if (displayName === "") {
        errorMessages.push("Display Name cannot be empty.");
      }
      const paymentMethod = document.querySelector(
        'input[name="paymentMethod"]:checked',
      );
      if (!paymentMethod) {
        errorMessages.push("Please select a payment method for when you win.");
      }
      if (tieBreakerValue === "") {
        errorMessages.push("Default Monday Night Tiebreaker cannot be empty.");
      }
      const defualtAlgorithm = document.querySelector(
        'input[name="defaultAlgorithm"]:checked',
      );
      if (!defualtAlgorithm) {
        errorMessages.push("Please select a default algorithm for picks.");
      }
      const tieBreakerNumber = Number(tieBreakerValue);
      if (
        isNaN(tieBreakerNumber) ||
        tieBreakerNumber < 0 ||
        tieBreakerNumber > 99
      ) {
        errorMessages.push("Default Monday Night Tiebreaker must be a number between 0 and 99.");
      }
      return errorMessages;
    }
    async function updateUserProfile() {
      const dataValid = await validateFormData(); // an array of strings.
      if (dataValid.length > 0) {
        alert("Please fix the following errors before submitting:\n" + dataValid)
        return;
      }
      try {
        const lambdaURL = await getServiceUrl("updateFBPUserPython");
        const formData = new FormData(document.forms.addFBPUser);
        const mobileNumberDigits = (formData.get("MobileNumber") || "")
          .toString()
          .replace(/\D/g, "")
          .slice(0, 10);
        if (mobileNumberDigits !== originalMobileNumberDigits) {
          alert("Mobile number changes must be verified first. Use 'Text Me A Verification Code' and then 'Verify' before saving your profile.");
          return;
        }
        const resolvedEmail = await resolveUserEmail();
        if (!resolvedEmail) {
          throw new Error("No authenticated user email found for update");
        }
        const existingProfile = window.userProfileData || {};

        const requestPayload = {
          email: resolvedEmail, // Use resolved email for update
          firstName: formData.get("firstName"),
          lastName: formData.get("lastName"),
          email: resolvedEmail,
          displayName: formData.get("displayName"),
          paymentMethod:
            document.querySelector('input[name="paymentMethod"]:checked')
              ?.value || "",
          isAdmin: formData.has("isAdmin")
            ? formData.get("isAdmin") === "on"
            : !!existingProfile.isAdmin,
          isAccountLocked: formData.has("isAccountLocked")
            ? formData.get("isAccountLocked") === "on"
            : !!existingProfile.isAccountLocked,
          isPaidUser: formData.has("isPaidUser")
            ? formData.get("isPaidUser") === "on"
            : !!existingProfile.isPaidUser,
          paymentMethod:
            document.querySelector('input[name="paymentMethod"]:checked')
              ?.value || "",
          emailPickSheet: formData.get("emailPickSheet") === "on",
          emailReminders: formData.get("emailReminders") === "on",
          emailGridSheet: formData.get("emailGridSheet") === "on",
          smsReminder: formData.get("smsReminder") === "on",
          smsPickSheet: formData.get("smsPickSheet") === "on",
          smsGridSheet: formData.get("smsGridSheet") === "on",
          defaultAlgorithm:
            document.querySelector('input[name="defaultAlgorithm"]:checked')
              ?.value || "",
          defaultTieBreaker: formData.get("defaultTieBreaker") || "",
        };

        const response = await fetch(lambdaURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestPayload),
        });

        console.log(
          "Response headers:",
          Object.fromEntries(response.headers.entries()),
        );
        const responseData = await response.text();
        console.log("Parsed response data:", responseData);

        if (!response.ok) {
          const errorBody =
            typeof responseData === "string"
              ? responseData
              : JSON.stringify(responseData);
          throw new Error(`Update failed (${response.status}): ${errorBody}`);
        }

        const successBody =
          typeof responseData === "string"
            ? responseData
            : JSON.stringify(responseData);
        alert("User updated successfully!");
      } catch (error) {
        console.error("Error:", error);
        alert(error.message || "Update failed. Please contact fbpadmin@my-fbp.com " + (error.message || error));
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      userProfileData = await getUserProfile();
      console.log("Profile data retrieved:", userProfileData);
    });

    const updateProfileButton = document.getElementById("updateProfileBtn");
    if (updateProfileButton) {
      updateProfileButton.addEventListener("click", updateUserProfile);
    }
    //});

    resolveUserEmail().catch((error) => {
      console.warn("User email not available during initial load:", error);
    });
  </script>

    import { formatPhoneNumber, initPhoneVerification } from "/js-lib/phoneVerification.js";

    window.formatPhoneNumber = formatPhoneNumber;
    window.phoneVerification = initPhoneVerification({
      resolveUserEmail: () => window.resolveUserEmail(),
    });
  </script>

      <script type="module">
        // Prefill form when userProfileData is available
        if (window.userProfileData) {
          console.log(
            "Pre-filling form with userProfileData:",
            window.userProfileData,
          );
          window.addEventListener("userProfileDataLoaded", (event) => {
            const userProfileData = event.detail;
            console.log(

              userProfileData,
            );
            let responseBody = JSON.parse(userProfileData.body);
            document.getElementById("firstName").value =
              responseBody.firstName || "";

              responseBody.lastName || "";

              responseBody.emailReminders || false;

              responseBody.emailGridSheet || false;
