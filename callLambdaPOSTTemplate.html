<!DOCTYPE html>
<html>
    <head>
        <title>Call Lambda Function with POST method</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="/css/styles.css" />
        <script type="module">
          import { wireHamburger } from "/js-lib/uiUtils.js";
          wireHamburger({ buttonId: "menuBtn", navId: "main-nav" });
        </script>
        <script>
            async function callFetch() {
            try {
                const { getServiceUrl } = await import("/js-lib/urlConfig.js");
                const URL_KEY = 'savePicks';
                const lambdaURL = await getServiceUrl(URL_KEY);
                let formData=new FormData(document.forms.FORMNAME);     // Replace FORMNAME with your form's name
                const response = await fetch(lambdaURL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        // Replace the following with your form fields
                        // id: formData.get('id'),
                        // itemName: formData.get('itemName'), 
                        // quantity: formData.get('quantity')
                    })
                });
        
            console.log('Status:', response.status);
            const data = await response.text();
            console.log('Response:', data);
            
            } catch (error) {
                console.error('Error:', error);
            }
        }
        </script>
    </head>
    <body class="fbp-home">
      <div class="container">
        <header>
          <h1>Menu</h1>
          <button id="menuBtn" class="menu-btn" type="button" aria-controls="main-nav" aria-expanded="false">☰ Menu</button>
          <nav id="main-nav" aria-label="Main navigation" data-open="false">
            <ul>
              <li><a href="/fbp-home.html">Home</a></li>
            </ul>
          </nav>
        </header>
        <main>
          <h1>Call Lambda Function with POST method</h1>
          <h2>This is a template for calling a Lambda function via POST.  Does not yet return a response.</h2>
          <!-- Fill out the form with input tags.  Provide new value for FORMNAME -->
          <form name="FORMNAME">
              <!-- <input name="id" type="number"> -->
          </form>
          <p>Click the button to call the Lambda function.</p>
          <button onclick="callFetch()">Call Lambda Function via Fetch</button>
        </main>
      </div>
    </body>
</html>
