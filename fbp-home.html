<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FBP Home</title>
  <script src="/js-lib/oidc-client-ts.min.js"></script>
  <link rel="stylesheet" type="text/css" href="/css/styles.css" />
  <script type="module">
    (async () => {
      const { auth } = await import("/js/auth.js");
      await auth.ensureAuthenticated();
      const user = await auth.getUser();
      console.log("Authenticated user:", user);
      window.user = user;

      // Now call getUserStatus after user is loaded
      const { getUserStatus } = await import("/js-lib/userUtils.js");
      await getUserStatus();
    })().catch(console.error);
  </script>
  <style>
    .li {
    margin: 0.5em 0;
    }

    @media (min-width: 1024px) {
    .li {
    margin: 0 0.5em;
    }
    }

    .nav-choices {
    margin-top: 1em;
    }

    .center-form {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: auto;
    }
    #statusBanner {
    display: block;
    margin: 8px auto 12px;
    padding: 8px 10px;
    border: 1px solid #0c5b63;
    background: #fff9db;
    color: #210c78;
    font-size: 0.92rem;
    width: fit-content;
    text-align: center;
    }
  </style>
</head>

<body class="fbp-home">
  <header>
    <h1>FBP Home</h1>
    <div id="statusBanner" aria-live="polite" style="text-align: center;"></div>
  </header>
  <script type="module">
    import { initNav } from "/js-lib/nav.js";
    import { setBannerStatusMessage } from "/js-lib/bannerUtils.js";
    await initNav();
    await setBannerStatusMessage();
  </script>
  <div class="container" style="display:flex; gap:2rem; align-items:flex-start; margin:0; max-width:100%;">
    <aside class="nav-choices">
      <!-- populated by nav.js -->
    </aside>
    <div id="chat-widget">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Ask me about FBP...">
      <button onclick="window.sendChatBotMessage()">Send</button>
    </div>
  </div>
  <script type="module">
    import { sendChatBotMessage } from "/js-lib/chatbot.js";
    window.sendChatBotMessage = sendChatBotMessage;
  </script>
  <footer>
    <p>
      Questions? Contact us at <a href="mailto:fbpadmin@my-fbp.com">fbpadmin@my-fbp.com</a>
    </p>
    <p>&copy; 2026 FBP. All rights reserved.</p>
  </footer>
</body>

</html>
