<!DOCTYPE html>
<html>
    <body>
        <title>Call Lambda Function</title>
        <h1>Call Lambda Function</h1>
        <p>Click the button to call the Lambda function.</p>
        <script>
            async function callFetch() {
            try {
                const { getServiceUrl } = await import("/js-lib/urlConfig.js");
                const lambdaURL = await getServiceUrl('createOrderDev');
                let formData=new FormData(document.forms.Order);
                const response = await fetch(lambdaURL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id: formData.get('id'),
                        itemName: formData.get('itemName'), 
                        quantity: formData.get('quantity')
                    })
                });
        
            console.log('Status:', response.status);
            const data = await response.text();
            console.log('Response:', data);
            
            } catch (error) {
                console.error('Error:', error);
            }
        }

            function callLambda() {
                let formData=new FormData(document.forms.Order);
                let data = {
                    id: formData.get('id'),
                    itemName: formData.get('itemNamen'),
                    quantity: formData.get('quantity')
                };

                (async () => {
                    const { getServiceUrl } = await import("/js-lib/urlConfig.js");
                    const lambdaURL = await getServiceUrl('createOrderProd');
                    let xhr = new XMLHttpRequest();
                    xhr.open('POST', lambdaURL, true);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.send(formData);
                    xhr.onreadystatechange = function () {
                        if (xhr.readyState === 4 && xhr.status === 200) {
                            console.log('Success:', xhr.responseText);
                            alert('Lambda function called successfully!');
                        } else if (xhr.readyState === 4) {
                            alert('Error calling Lambda function.' + xhr.statusText);
                        }
                    };

                    xhr.onload = function () {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            console.log('Response:', xhr.responseText);
                        } else {
                            alert('Error calling Lambda function.' + xhr.statusText);
                        }
                    };
                })().catch((error) => {
                    console.error('Error:', error);
                    alert('Error calling Lambda function. ' + error.message);
                });

            }
        </script>
    </body>
    <body>
        <form name="Order">
            <input name="id" type="number">
            <input name="itemName" type="text">
            <input name="quantity" type="number">
        </form>
        <p>Click the button to call the Lambda function.</p>
        <button onclick="callFetch()">Call Lambda Function via Fetch</button>
    </body>
</html>
