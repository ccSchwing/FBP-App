<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js-lib/oidc-client-ts.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/styles.css" />
    <title>FBP Ledger</title>
    <style>
        #ledgerTable tbody tr:nth-child(even) {
            background-color: #ffffff;
        }

        #ledgerTable tbody tr:hover {
            background-color: #f5f5f5;
        }

        #ledgerTable {
            border-collapse: collapse;
            width: 100%;
        }

        #ledgerTable th, #ledgerTable td {
            border: 1px solid #ccc;
            padding: 8px 12px;
        }

        #ledgerTable thead tr {
            background-color: #4caf50;
            color: white;
        }
    </style>
    <script type="module">
        import { auth } from "/js/auth.js";
        import { initNav } from "/js-lib/nav.js";
        await auth.ensureAuthenticated();
        const user = await auth.getUser();
        console.log("Authenticated user:", user);
        window.user = user;

        // Now call getUserStatus after user is loaded
        const { getUserStatus } = await import("/js-lib/userUtils.js");
        await getUserStatus();
        await initNav();
    </script>
    <script type="module">
        async function setGridStatus(message, type = "success") {
            const statusDiv = document.getElementById("gridStatus");
            statusDiv.textContent = message;
            statusDiv.className = type; // Use class to set color based on type
        }
        window.setGridStatus = setGridStatus; // Make it globally accessible for other scripts
    </script>
    <script>
        window.addEventListener("DOMContentLoaded", async () => {
            const response = await getLedger();
        });

        async function getLedger() {
            try {
                setGridStatus("Fetching FBP Ledger...");
                const { getServiceUrl } = await import("/js-lib/urlConfig.js");
                const URL_KEY = "FBPLedger";
                const lambdaURL = await getServiceUrl(URL_KEY);
                const response = await fetch(lambdaURL, {
                    method: "GET",
                    headers: { "Content-Type": "application/json" },
                });
                console.log("Status:", response.status);
                if (response.ok) {
                    const data = await response.json();
                    console.log("Response:", data);
                    populateLedgerTable(data);
                    setGridStatus("FBP Ledger fetched successfully.", "success");
                    window.results = data;
                } else {
                    console.error(
                        "Error: Lambda function returned status",
                        response.status,
                    );
                    setGridStatus(
                        "Error fetching FBP Ledger. Check console for details.",
                        "error",
                    );
                }
            } catch (error) {
                console.error("Error fetching FBP Ledger:", error);
                setGridStatus(
                    "Error fetching FBP Ledger. Check console for details.",
                    "error",
                );
            }
        }
    </script>
</head>

<body class="fbp-home">
    <aside class="nav-choices">
        # populated by nav.js
    </aside>


    <header>
        <h1 style="text-align: center" class="page-title">FBP Ledger
        </h1>
    </header>
    <div class="results-layout">
        <main class="results-main">
            <table id="ledgerTable">
                <thead>
                    <tr>
                        <th>RecordType</th>
                        <th>Date</th>
                        <th>Week</th>
                        <th>Display Name</th>
                        <th>Last Transaction Amount</th>
                        <th>FBP Cash Balance</th>
                        <!-- Cash Balance is the latest available FBP Cash balance for the Pool -->
                    </tr>
                </thead>
                <tbody></tbody>
                <script>
                    function populateLedgerTable(results) {
                        const tbody = document.querySelector("#ledgerTable tbody");
                        tbody.innerHTML = ""; // Clear existing rows
                        results.forEach((record) => {
                            const row = document.createElement("tr");
                            if (record.RecordType === "BALANCE") {
                                row.style.fontWeight = "bold"; // Highlight balance records

                                row.innerHTML = `
                            <td>${record.RecordType}</td>
                            <td>${new Date(record.Timestamp.replace('Z', '')).toLocaleString('en-US', { timeZone: 'America/New_York' })}</td>
                            <td>${record.week}</td>
                            <td>${record.displayName}</td>
                            <td>${record.amount}</td>
                            <td>${record.currentBalance}</td>
                        `;
                                tbody.appendChild(row);
                            }
                            // Don't display the current balance for PAYOUT records
                            if (record.RecordType === "PAYOUT") {
                                row.style.fontWeight = "bold"; // Highlight balance records
                                row.innerHTML = `
                            <td>${record.RecordType}</td>
                            <td>${new Date(record.Timestamp.replace('Z', '')).toLocaleString('en-US', { timeZone: 'America/New_York' })}</td>
                            <td>${record.week}</td>
                            <td>${record.displayName}</td>
                            <td>${record.amount}</td>
                            <td></td>
                        `;
                                tbody.appendChild(row);
                            }
                        });
                    }
                </script>
            </table>
            <div id="gridStatus" style="margin-top: 20px"></div>
        </main>
    </div> <!-- Close results-layout div -->
</body>

</html>
