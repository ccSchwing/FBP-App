<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js-lib/oidc-client-ts.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/styles.css" />
    <script type="module">
        import { auth } from "/js/auth.js";
        await auth.ensureAuthenticated();
        const user = await auth.getUser();
        if (user && user.profile && user.profile.email) {
            const userEmail = user.profile.email;
            window.userEmail = userEmail; // make it global for convenience
        }
        console.log("Authenticated user:", user);
        window.user = user;

        // Now call getUserStatus after user is loaded
        const { getUserStatus } = await import("/js-lib/userUtils.js");
        await getUserStatus();
    </script>
    <script type="module">
        import { getServiceUrl } from "/js-lib/urlConfig.js";
        async function fetchTeamRecords() {
            const urlKey = "getTeamRecords";
            const serviceUrl = await getServiceUrl(urlKey);
            const response = await fetch(serviceUrl, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                },
            });
            if (!response.ok) {
                throw new Error(`Failed to fetch team records data with status ${response.status}`);
            }
            const data = await response.json();
            if (!data) {
                throw new Error("Received empty data for team records.");
            }
            console.log("Fetched team records data:", data);
            const parsed = JSON.parse(data.body);
            const list = parsed.items ?? parsed;
            console.log("Parsed team records data:", parsed);
            console.log("Parsed list of records data:", list);
            return list.sort((a, b) => a.TeamName.localeCompare(b.TeamName)); // Sort by team name
        }

        function createTeamRecordsTable(teamRecordsData) {
            if (!teamRecordsData || teamRecordsData.length === 0) {
                return "<p>No team records data available.</p>";
            }
            let tableHTML = `<table id="teamRecordsTable">
                <thead>
                    <tr>
                        <th>Team</th>
                        <th>Games Played</th>
                        <th>Wins As Favorite</th>
                        <th>Losses As Favorite</th>
                        <th>Wins As Underdog</th>
                        <th>Losses As Underdog</th>
                    </tr>
                </thead>
                <tbody>`;
            teamRecordsData.forEach((record) => {
                tableHTML += `<tr>
                    <td>${record.TeamName}</td>
                    <td>${record.GamesPlayed}</td>
                    <td>${record.FavoriteWins}</td>
                    <td>${record.FavoriteLosses}</td>
                    <td>${record.UnderdogWins}</td>
                    <td>${record.UnderdogLosses}</td>
                </tr>`;
            });
            tableHTML += "</tbody></table>";
            return tableHTML;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const teamRecordsData = await fetchTeamRecords();
                document.getElementById("team-records-table-container").innerHTML = createTeamRecordsTable(teamRecordsData);
            } catch (error) {
                console.error("Error fetching team records:", error);
                alert("Failed to load team records data. Please try again later.");
            }
        });
    </script>
    <style>
        #teamRecordsTable {
            border-collapse: collapse;
            border: 2px solid black;
            margin-top: 5px;
        }
        #teamRecordsTable th,
        #teamRecordsTable td {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: left;
        }
        #teamRecordsTable th {
            background-color: #4caf50;
            color: white;
            font-weight: bold;
        }
        #teamRecordsTable tbody tr:nth-child(odd)  { background-color: #f9f9f9; }
        #teamRecordsTable tbody tr:nth-child(even) { background-color: #ffffff; }
        #teamRecordsTable tbody tr:hover           { background-color: #f5f5f5; }
    </style>
    <title>Get Team Records</title>
</head>

<body class="fbp-home">
    <header>
        <h1 class="page-title">NFL Team Records</h1>
    </header>
    <div class="container" style="display:flex; gap:2rem; align-items:flex-start; margin:0; max-width:100%;">
        <script type="module">
            import { initNav } from "/js-lib/nav.js";
            await initNav();
        </script>
        <aside class="nav-choices">
            <!-- populated by nav.js -->
        </aside>
        <main class="results-main">
            <div id="team-records-table-container"></div>
        </main>
    </div>
    <footer>
        <p>
            Questions? Contact us at <a href="mailto:fbpadmin@my-fbp.com">fbpadmin@my-fbp.com</a>
        </p>
        <p>&copy; 2026 FBP. All rights reserved.</p>
    </footer>
</body>

</html>
