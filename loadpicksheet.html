<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load PickSheet</title>
  <script src="/js-lib/oidc-client-ts.min.js"></script>
  <link rel="stylesheet" type="text/css" href="/css/styles.css" />
  <script type="module">
    import { auth } from "/js/auth.js";
    await auth.ensureAuthenticated();
      const user = await auth.getUser();
      console.log("Authenticated user:", user);
      window.user = user;
      // Now call getUserStatus after user is loaded
      const { getUserStatus } = await import("/js-lib/userUtils.js");
      await getUserStatus();
  </script>
  <script type="module">
    import { getServiceUrl } from "/js-lib/urlConfig.js";
    async function callGETFetch() {
      try {
        const URL_KEY = "getScheduleSheet";
        const lambdaURL = await getServiceUrl(URL_KEY);
        const response = await fetch(lambdaURL, {
          method: "GET",
          headers: { "Content-Type": "application/json" },
        });
        console.log("Status:", response.status);
        const data = await response.json();
        console.log("Response:", data);
        sessionStorage.setItem("scheduleData", JSON.stringify(data));
        alert("Schedule data loaded and saved to session storage.");
        window.location.href = "picksheet.html";
      } catch (error) {
        console.error("Error:", error);
      }
    }
    window.callGETFetch = callGETFetch;
  </script>
</head>

<body class="fbp-home">
  <div class="container">
    <header>
      <h1>Load PickSheet</h1>
    </header>
    <script type="module">
      import { initNav } from "/js-lib/nav.js";
      await initNav();
    </script>
    <aside class="nav-choices">
      <!-- populated by nav.js -->
    </aside>
  </div>
  <p>Click to load existing picks</p>
  <button onclick="callGETFetch()" aria-label="Load FBP Picks">Load FBP Picks</button>
  <footer>
    <p>
      Questions? Contact us at <a href="mailto:fbpadmin@my-fbp.com">fbpadmin@my-fbp.com</a>
    </p>
    <p>&copy; 2026 FBP. All rights reserved.</p>
  </footer>
</body>

</html>
