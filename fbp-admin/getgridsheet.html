      display: inline-block;

      background: #333;
      color: #fff;
      font-size: 0.75rem;

      bottom: 110%;
      left: 50%;

      z-index: 10;
    }

    .tooltip-wrap:hover .tooltip {
      visibility: visible;
    }

    .pick-img {

      background: #fff9db;
      color: #210c78;

  <!-- Get pool status.  Only show gridsheet when the Pool is closed -->
  <script type="module">
    import { getServiceUrl } from "/js-lib/urlConfig.js";

    async function checkPoolStatus() {
      try {
        const apiEndpoint = await getServiceUrl("getPoolStatus");
        const response = await fetch(apiEndpoint);
        if (!response.ok) {
          throw new Error(`getPoolStatus failed with status ${response.status}`);
        }

        const payload = await response.json();
        const parsedBody = JSON.parse(payload.body)
        if (parsedBody.pool_open == true) {
          alert("The pool is currently open. The gridsheet will be available after the pool closes on Thursday.  Redirecting to home page.");
          window.location.href = "/fbp-home.html"; // Redirect to home or another appropriate page
        }
      } catch (error) {
        console.error("Error checking pool status:", error);
        alert("Unable to check pool status right now.  Contact fbpadmin@my-fbp.com if you think this is an error.");
      }
    }

    document.addEventListener("DOMContentLoaded", checkPoolStatus);
  </script>
</head>

<body class="fbp-home">
  <script type="module">

    });
  </script>
  <header>
    <h1 id="header">FBP Week <span id="current-week"></span> Gridsheet</h1>
  </header>
  <div class="container" style="display:flex; gap:2rem; align-items:flex-start; margin:0; max-width:100%;">
    <div style="flex:1; min-width:0;">
      <div id="diagnosticsBanner" aria-live="polite"></div>

      <table id="gridSheetTable" style="margin-left: auto; margin-right: auto;">
        <thead>

  </div>
  <script type="module">
    import { getServiceUrl } from "/js-lib/urlConfig.js";

    /* function setInfoBanner(message = "") {
      const bannerEl = document.getElementById("infoBanner");
      if (!bannerEl) {
        return;
      }

      if (!message) {

      bannerEl.textContent = message;

    */
    function setDiagnostics(message = "") {
      const bannerEl = document.getElementById("diagnosticsBanner");
      if (!bannerEl) {
        return;
      }

      if (!message) {
        bannerEl.textContent = "";
        bannerEl.style.display = "none";
        return;
      }

      const traceId = new Date().toISOString().replace(/[\-:.TZ]/g, "").slice(0, 14);
      bannerEl.textContent = `${message} (trace: ${traceId})`;
      bannerEl.style.display = "block";
    }

    // This function returns the schedule for the current week,
    // which is needed to map pick codes (H/A) to actual team names in the grid sheet.
    async function fetchWeeklySchedule() {
      const apiEndpoint = await getServiceUrl("getSchedule");
      const response = await fetch(apiEndpoint);
      if (!response.ok) {
        throw new Error(`getSchedule failed with status ${response.status}`);
      }

      // Some API responses place the real JSON inside response.body as a string.
      const payload = await response.json();
      const parsedBody = parseNestedJson(payload?.body ?? payload);
      const scheduleData = parseNestedJson(parsedBody);
      console.log("Fetched schedule data:", scheduleData);
      return scheduleData;
    }

    function parseNestedJson(value) {
      return typeof value === "string" ? JSON.parse(value) : value;
    }

    async function fetchAllUserPicks() {
      const apiEndpoint = await getServiceUrl("getAllFBPPicksPython");
      const response = await fetch(apiEndpoint);
      if (!response.ok) {
        throw new Error(
          `getAllFBPPicksPython failed with status ${response.status}`,
        );
      }

      const payload = await response.json();
      // Some API responses place the real JSON inside response.body as a string.
      const parsedBody = parseNestedJson(payload?.body ?? payload);
      const picksData = parseNestedJson(parsedBody);

      console.log("Fetched grid sheet data:", picksData);
      return Array.isArray(picksData) ? picksData : [];
    }

    function selectGamesForWeek(scheduleData, week) {
      return scheduleData
        .map((game) => (typeof game === "string" ? JSON.parse(game) : game))
        .filter((game) => String(game?.Week ?? "") === String(week));
    }

    function replacePickCodesWithTeams(scheduleData, picksData) {
      return picksData.map((userRow) => {
        const picksString = String(userRow?.picks ?? "");
        if (!picksString) {
          return { ...userRow, picks: "" };
        }

        const week = userRow?.week ?? userRow?.Week ?? scheduleData?.[0]?.Week;
        const gamesForWeek = selectGamesForWeek(scheduleData, week);
        if (gamesForWeek.length === 0) {
          return { ...userRow };
        }

        const mappedPicks = picksString
          .split("")
          .map((pick, index) => {
            const game = gamesForWeek[index];
            if (!game) {
              return pick;
            }
            if (pick === "H") {
              return game.Home;
            }
            if (pick === "A") {
              return game.Away;
            }
            return pick;
          })
          .join(" ");

        return {
          ...userRow,
          picks: mappedPicks,
        };
      });
    }

    function renderWeeklyGridSheet(rows, scheduleData) {
      const tableBody = document.querySelector("#gridSheetTable tbody");
      if (!tableBody) {
        return;
      }

      tableBody.innerHTML = "";
      rows.forEach((userPick) => {    // userPick.picks is a string of team names separated by spaces, in the same order as the games in the schedule data.
        const row = document.createElement("tr");
        const displayNameCell = document.createElement("td");
        const picksCell = document.createElement("td");
        const tieBreakerCell = document.createElement("td");

        displayNameCell.textContent = userPick.displayName ?? "";
        const pickList = (userPick.picks ?? "").split(" ").filter(Boolean);

        pickList.forEach((teamName, i) => {
          const img = document.createElement("img");
          img.src = `/images/${teamName}.gif`;
          img.alt = teamName;
          img.className = "pick-img";

          const wrap = document.createElement("span");
          wrap.className = "tooltip-wrap";

          const tip = document.createElement("span");
          tip.className = "tooltip";
          const game = scheduleData[i];
          if (game) {
            const isUnderdog =
              (teamName === game.Home && game.Underdog === "H") ||
              (teamName === game.Away && game.Underdog === "A");
            const spread = isUnderdog ? `+${game.Spread}` : `-${game.Spread}`;
            tip.textContent = `${teamName} ${spread}`;
          } else {
            tip.textContent = teamName;
          }

          wrap.appendChild(img);
          wrap.appendChild(tip);
          picksCell.appendChild(wrap);
        });
        tieBreakerCell.textContent = userPick.tieBreaker ?? "";

        row.appendChild(displayNameCell);
        row.appendChild(picksCell);
        row.appendChild(tieBreakerCell);
        tableBody.appendChild(row);
      });
      /* setInfoBanner(
        "Hover over each pick to see the team name and spread for the game.",
      );
      */
    }

    async function loadGridSheet() {
      const timestampEl = document.getElementById("timestamp");
      if (timestampEl) {
        timestampEl.textContent = new Date().toLocaleString();
      }

      try {
        setDiagnostics("");
        const scheduleData = await fetchWeeklySchedule();
        const picksData = await fetchAllUserPicks();
        //

        const rows = replacePickCodesWithTeams(scheduleData, picksData);
        // You need to pass the schedule data to function
        // so that you can show the spread in the hover text.

        renderWeeklyGridSheet(rows, scheduleData);
        setDiagnostics("");
      } catch (error) {
        console.error("Error loading weekly gridsheet:", error);
        setDiagnostics(`Load error: ${error?.message || "Unknown error"}`);
        alert("Unable to load weekly gridsheet right now.");
      }
    }

    document.addEventListener("DOMContentLoaded", loadGridSheet);
  </script>
</body>
