<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/js-lib/oidc-client-ts.min.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/styles.css" />
        <style>
          #main-nav {
            display: none;
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            background: #fff;
            border-bottom: 1px solid #ccc;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
          }
          #main-nav[aria-expanded="true"], #main-nav[data-open="true"] {
            display: block;
          }
          .menu-btn {
            display: inline-block;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 1.2em;
            margin-bottom: 0;
            z-index: 1100;
            position: relative;
            cursor: pointer;
          }
          @media (min-width: 700px) {
            #main-nav {
              display: block !important;
              position: static;
              background: none;
              border: none;
              box-shadow: none;
            }
            #main-nav ul {
              display: flex;
              gap: 1.5em;
              justify-content: flex-start;
              align-items: center;
            }
            .menu-btn {
              display: none;
            }
          }
          #main-nav ul {
            list-style: none;
            padding: 0.5em 1em;
            margin: 0;
          }
          #main-nav li {
            margin: 0.5em 0;
          }
          @media (min-width: 700px) {
            #main-nav li {
              margin: 0 0.5em;
            }
          }
        </style>
    <title>Calc Results For Week</title>
    <script type="module">
      import { auth } from "/js/auth.js";
      await auth.ensureAuthenticated();
    </script>
    <script type="module">
      function setGridStatus(message, kind = "") {
        const statusEl = document.getElementById("gridStatus");
        if (!statusEl) {
          return;
        }

        statusEl.textContent = message;
        statusEl.classList.remove("error", "success");
        if (kind === "error" || kind === "success") {
          statusEl.classList.add(kind);
        }
      }
      window.setGridStatus = setGridStatus; // Make globally accessible for inline onclick
    </script>
    <h1>Game Results Calculation</h1>
    <h2>
      Ensure that you've updated the final scores in the 2026-Schedule table
      before running this.
    </h2>
    <script>
      async function calcGameResults() {
        try {
          setGridStatus("Calculating weekly game results...");
          const { getServiceUrl } = await import("/js-lib/urlConfig.js");
          const URL_KEY = "calcWeeklyResults";
          const lambdaURL = await getServiceUrl(URL_KEY);
          const response = await fetch(lambdaURL, {
            method: "GET",
            headers: { "Content-Type": "application/json" },
          });
          const data = await response.text();
          console.log("Status:", response.status);
          console.log("Response:", data);

          if (response.ok) {
            setGridStatus(
              "Weekly game results calculated successfully.",
              "success",
            );
          } else {
            console.error(
              "Error: Lambda function CalculateWeeklyResults returned status",
              response.status,
            );
            setGridStatus(
              "Error executing Lambda function. Check console for details.",
              "error",
            );
          }
        } catch (error) {
          console.error("Error calling CalculateWeeklyResults:", error);
          setGridStatus(
            "Network error while calling CalculateWeeklyResults. Check console for details.",
            "error",
          );
        }
      }
      async function updateUserResults() {
        try {
          setGridStatus("Updating user results for the week...");
          const { getServiceUrl } = await import("/js-lib/urlConfig.js");
          const URL_KEY = "updateWeeklyResults";
          const lambdaURL = await getServiceUrl(URL_KEY);
          const response = await fetch(lambdaURL, {
            method: "GET",
            headers: { "Content-Type": "application/json" },
          });
          const data = await response.text();
          console.log("Status:", response.status);
          console.log("Response:", data);

          if (response.ok) {
            setGridStatus(
              "User results updated successfully.",
              "success",
            );
          } else {
            console.error(
              "Error: Lambda function UpdateWeeklyResults returned status",
              response.status,
            );
            setGridStatus(
              "Error executing UpdateWeeklyResults function. Check console for details.",
              "error",
            );
          }
        } catch (error) {
          console.error("Error calling UpdateWeeklyResults:", error);
          setGridStatus(
            "Network error while calling UpdateWeeklyResults. Check console for details.",
            "error",
          );
        }
      }
    </script>
    <style>
      table th,
      table td {
        border: 1px solid black;
      }

      table {
        width: auto;
        border: 2px solid black;
        padding: 5px;
        margin-top: 5px;
        margin-bottom: 5px;
        background-origin: padding-box;
        border-collapse: collapse;
        border-color: black;
      }

      #setGridStatus {
        margin: 8px 0;
        font-weight: 600;
        min-height: 1.2em;
      }

      #setGridStatus.error {
        color: #b00020;
      }

      #setGridStatus.success {
        color: #0b6b2e;
      }
    </style>
  </head>
  <body class="fbp-home">
    <header>
      <h1>Game Results Calculation</h1>
    </header>
    <div class="container" style="display:flex; gap:2rem; align-items:flex-start; margin:0; max-width:100%;">
      <script type="module">
        import { initAdminNav } from "/js-lib/adminNav.js";
        await initAdminNav();
      </script>
      <aside class="nav-choices">
        <!-- populated by adminNav.js -->
      </aside>
      <main>
        <div id="gridStatus" aria-live="polite"></div>
      </main>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        resultsUpdated = async () => {
          await calcGameResults();
          await updateUserResults();  // Figure out who won/lost for the week.
          // Now you can figure out how each user did for the week.
          // This will update the UserResults table with each user's wins/losses for the week.
        };
        resultsUpdated();
      });
    </script>
  </body>
</html>
